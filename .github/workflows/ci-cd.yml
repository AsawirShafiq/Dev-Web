name: CI/CD Pipeline

on:
  push:
    branches:
      - huzaifa
  pull_request:
    branches:
      - huzaifa

env:
  BACKEND_IMAGE: grocery_backend
  FRONTEND_IMAGE: grocery_frontend

jobs:
  # --------------------------
  # Build Backend
  # --------------------------
  build_backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Docker Image
        run: |
          echo "🐳 Building Backend Docker image..."
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f grocery_backend/Dockerfile ./grocery_backend
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
      
      - name: Save Backend Docker Image
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} | gzip > backend-image.tar.gz
      
      - name: Upload Backend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Build Frontend
  # --------------------------
  build_frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Frontend Docker Image
        run: |
          echo "⚛️ Building Frontend Docker image..."
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -f grocery-frontend/Dockerfile ./grocery-frontend
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
      
      - name: Save Frontend Docker Image
        run: |
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} | gzip > frontend-image.tar.gz
      
      - name: Upload Frontend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Test
  # --------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build_backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          cd grocery_backend
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          cd grocery_backend
          pytest || echo "⚠️ No tests found or tests failed"

  # --------------------------
  # Deploy to AWS EC2
  # --------------------------
  deploy_production:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend, test]
    if: github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST || '13.36.244.170' }}:5173
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Debug Information
        run: |
          echo "📋 Deployment Information:"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "❌ DEPLOY_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "❌ DEPLOY_USER secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"
      
      - name: Setup SSH
        run: |
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          echo "🔌 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo '✅ SSH connection successful'"
      
      - name: Deploy to EC2
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "🚀 Deploying to AWS EC2..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST bash << 'ENDSSH'
            set -e
            
            echo "📋 Deploying branch: ${BRANCH_NAME}"
            
            # Update system packages
            echo "📦 Updating system packages..."
            sudo apt update -y
            sudo apt install -y docker.io git curl
            
            # Install docker-compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo "📦 Installing docker-compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            # Start Docker service
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add user to docker group
            sudo usermod -aG docker $USER || true
            
            # Create project directory if it doesn't exist
            PROJECT_DIR=~/grocery_app
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📁 Cloning repository..."
              git clone https://github.com/${REPO_NAME}.git $PROJECT_DIR
              cd $PROJECT_DIR
              git checkout ${BRANCH_NAME}
            else
              cd $PROJECT_DIR
              
              # Clean Python cache
              echo "🧹 Cleaning cache..."
              find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
              find . -type f -name '*.pyc' -delete 2>/dev/null || true
              find . -type d -name 'node_modules' -exec rm -rf {} + 2>/dev/null || true
              
              # Fetch and pull latest changes
              echo "🔄 Pulling latest changes from ${BRANCH_NAME}..."
              git fetch origin
              git checkout ${BRANCH_NAME}
              git reset --hard origin/${BRANCH_NAME}
              git pull origin ${BRANCH_NAME}
            fi
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            sudo docker-compose down --remove-orphans || true
            
            # Remove old images
            echo "🗑️ Cleaning up old Docker images..."
            sudo docker system prune -af --volumes || true
            
            # Build and start containers
            echo "🐳 Building and starting containers..."
            sudo docker-compose up -d --build --force-recreate
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Show status
            echo "✅ Deployment complete!"
            sudo docker-compose ps
            
            # Show logs
            echo "📋 Recent logs:"
            sudo docker-compose logs --tail=50
          ENDSSH
      
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 20
          
          # Check backend
          if curl -f -s --connect-timeout 10 http://${{ secrets.DEPLOY_HOST }}:8000/docs > /dev/null; then
            echo "✅ Backend is responding"
          else
            echo "⚠️ Backend is not responding yet (this may be normal during first deployment)"
          fi
          
          # Check frontend
          if curl -f -s --connect-timeout 10 http://${{ secrets.DEPLOY_HOST }}:5173 > /dev/null; then
            echo "✅ Frontend is responding"
          else
            echo "⚠️ Frontend is not responding yet (this may be normal during first deployment)"
          fi
      
      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          echo "🧹 SSH keys cleaned up"

  # --------------------------
  # Notify on Success/Failure
  # --------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy_production]
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Deployment Success
        if: needs.deploy_production.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ secrets.DEPLOY_HOST }}:5173"
          echo "🔧 Backend API: http://${{ secrets.DEPLOY_HOST }}:8000"
          echo "📚 API Docs: http://${{ secrets.DEPLOY_HOST }}:8000/docs"
          echo "🗄️ MongoDB: mongodb://${{ secrets.DEPLOY_HOST }}:27017"
      
      - name: Deployment Failed
        if: needs.deploy_production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          exit 1