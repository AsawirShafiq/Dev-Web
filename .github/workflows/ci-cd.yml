name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BACKEND_IMAGE: grocery_backend
  FRONTEND_IMAGE: grocery_frontend

jobs:
  # --------------------------
  # Build Backend
  # --------------------------
  build_backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Docker Image
        run: |
          echo "🐳 Building Backend Docker image..."
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f grocery_backend/Dockerfile ./grocery_backend
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
      
      - name: Save Backend Docker Image
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} | gzip > backend-image.tar.gz
      
      - name: Upload Backend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Build Frontend
  # --------------------------
  build_frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Frontend Docker Image
        run: |
          echo "⚛️ Building Frontend Docker image..."
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -f grocery-frontend/Dockerfile ./grocery-frontend
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
      
      - name: Save Frontend Docker Image
        run: |
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} | gzip > frontend-image.tar.gz
      
      - name: Upload Frontend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Test
  # --------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build_backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          cd grocery_backend
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          cd grocery_backend
          pytest || echo "⚠️ No tests found or tests failed"

  # --------------------------
  # Deploy to AWS EC2
  # --------------------------
  deploy_production:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST }}:5173
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Deploying to AWS EC2..."
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
            set -e
            
            # Update system packages
            echo "📦 Updating system packages..."
            sudo apt update -y
            sudo apt install -y docker.io docker-compose git
            
            # Create project directory if it doesn't exist
            PROJECT_DIR=~/grocery_app
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📁 Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            # Navigate to project directory
            cd $PROJECT_DIR
            
            # Clean Python cache
            echo "🧹 Cleaning cache..."
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name '*.pyc' -delete 2>/dev/null || true
            
            # Stash any local changes and pull latest
            echo "🔄 Pulling latest changes..."
            git stash || true
            git pull origin main
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            sudo docker-compose down || true
            
            # Build and start containers
            echo "🐳 Building and starting containers..."
            sudo docker-compose up -d --build
            
            # Show status
            echo "✅ Deployment complete!"
            sudo docker-compose ps
          ENDSSH
      
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}:8000/docs || echo "⚠️ Backend not responding yet"
          curl -f http://${{ secrets.DEPLOY_HOST }}:5173 || echo "⚠️ Frontend not responding yet"
      
      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

  # --------------------------
  # Notify on Success/Failure
  # --------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy_production]
    if: always()
    
    steps:
      - name: Deployment Success
        if: needs.deploy_production.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ secrets.DEPLOY_HOST }}:5173"
          echo "🔧 Backend API: http://${{ secrets.DEPLOY_HOST }}:8000"
          echo "📚 API Docs: http://${{ secrets.DEPLOY_HOST }}:8000/docs"
      
      - name: Deployment Failed
        if: needs.deploy_production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          exit 1